# DVC Pipeline for Healthcare Risk Prediction
#
# The launch pipeline is intentionally small and offline-friendly: it
# regenerates the deterministic stub artifacts that let the API boot, tests
# run, and Docker images smoke-test from a fresh clone. Full retraining still
# requires the raw BRFSS/lung datasets and a configured DVC remote.
#
# Run:
#   dvc repro ml/dvc.yaml
#   dvc status ml/dvc.yaml

stages:
  generate_stub_models:
    wdir: ..
    cmd: python -m ml.models.generate_stubs
    deps:
      - ml/models/generate_stubs.py
      - ml/models/stubs.py
    outs:
      - ml/models/diabetes_xgboost.pkl:
          cache: false
      - ml/models/isotonic_calibrator.pkl:
          cache: false
      - ml/models/heart_disease_xgboost.pkl:
          cache: false
      - ml/models/heart_disease_calibrator.pkl:
          cache: false
      - ml/models/heart_disease_features.pkl:
          cache: false
      - ml/models/lung_cancer_model.pkl:
          cache: false
      - ml/models/lung_cancer_scaler.pkl:
          cache: false
      - ml/models/lung_cancer_features.pkl:
          cache: false
      - ml/models/lung_cancer_calibrator.pkl:
          cache: false
