# ─────────────────────────────────────────────────────────────
#  Nginx — Production reverse-proxy for HealthPredict AI
#  Handles: SSL termination, rate limiting, security headers,
#           request-size limits, static caching, gzip.
# ─────────────────────────────────────────────────────────────

# ── Rate-limit zones ──────────────────────────────────────────
# 10 req/s per client IP for prediction & API endpoints
limit_req_zone $binary_remote_addr zone=predict_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=20r/s;

# ── Upstream ──────────────────────────────────────────────────
upstream fastapi {
    server web:8000;
    keepalive 32;
}

# ══════════════════════════════════════════════════════════════
#  HTTP → HTTPS redirect
# ══════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ══════════════════════════════════════════════════════════════
#  HTTPS — main server block
# ══════════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    server_name _;

    # ── SSL certificates (Let's Encrypt / custom) ─────────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ── Modern SSL settings ───────────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Request size limit (Task 5) ───────────────────────────
    client_max_body_size 2M;

    # ── Security headers (Task 6) ─────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header X-XSS-Protection       "1; mode=block"                 always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    # ── Hide server version ───────────────────────────────────
    server_tokens off;

    # ── Gzip compression ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Static files (served directly by Nginx) ───────────────
    location /static/ {
        alias /app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Prediction endpoints — strict rate limit ──────────────
    location /predict {
        limit_req zone=predict_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://fastapi;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── API endpoints — moderate rate limit ───────────────────
    location /api {
        limit_req zone=api_limit burst=40 nodelay;
        limit_req_status 429;

        proxy_pass         http://fastapi;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Metrics — internal only (block external access) ───────
    location /metrics {
        # Allow only internal Docker network; deny everyone else
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny  all;

        proxy_pass         http://fastapi;
        proxy_set_header   Host $host;
    }

    # ── Health check ──────────────────────────────────────────
    location /healthz {
        proxy_pass         http://fastapi;
        proxy_set_header   Host $host;
        access_log off;
    }

    # ── Default — all other routes ────────────────────────────
    location / {
        proxy_pass         http://fastapi;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Block dotfiles (security) ─────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Custom error pages ────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
