[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=app",
    "--cov=fastapi_backend",
    "--cov=utils",
    "--cov=feature_store",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/notebooks/*",
    "retrain.py",
    "app/risk_assistant.py",
    "fastapi_backend/main.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "raise NotImplementedError",
]
