[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=backend.app",
    "--cov=ml",
    "--cov=shared",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/ml/experiments/*",
    "ml/pipelines/training/train.py",
    "ml/pipelines/inference/risk_assistant.py",
    "backend/app/api/legacy_main.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "raise NotImplementedError",
]
