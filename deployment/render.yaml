services:
  - type: web
    name: healthcare-risk-prediction
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MODEL_SOURCE
        value: local
      - key: ALLOWED_ORIGINS
        value: https://healthcare-risk-prediction.onrender.com
      - key: TRUSTED_HOSTS
        value: healthcare-risk-prediction.onrender.com
      - key: JWT_SECRET_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MLFLOW_TRACKING_URI
        sync: false
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "4"
