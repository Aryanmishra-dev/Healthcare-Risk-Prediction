replicaCount: 3

image:
  repository: aryanmdev/healthpredict-ai
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

db:
  # Database connection URL for the application
  # Provide via --set db.url=... or external-secrets. Do not hardcode.
  url: "postgresql+asyncpg://user:CHANGE_ME@healthpredict-db:5432/healthcare_audit"

redis:
  host: "healthpredict-redis-master"
  port: 6379

ingress:
  host: "api.healthpredict.com"
