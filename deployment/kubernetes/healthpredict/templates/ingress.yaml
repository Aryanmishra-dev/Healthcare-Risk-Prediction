apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "healthpredict.fullname" . }}-ingress
  labels:
    app.kubernetes.io/name: {{ include "healthpredict.name" . }}
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - "{{ .Values.ingress.host }}"
      secretName: {{ include "healthpredict.fullname" . }}-tls
  rules:
    - host: "{{ .Values.ingress.host }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "healthpredict.fullname" . }}
                port:
                  number: 80
