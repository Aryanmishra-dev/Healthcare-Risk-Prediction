services:
  # ── FastAPI application (internal only — NOT exposed to internet) ─────
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: aryanmdev/healthpredict-ai:latest
    container_name: healthpredict
    expose:
      - "8000"
    env_file:
      - ../../.env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
    volumes:
      - ../../ml/models:/app/ml/models:ro
      - ../../data:/app/data:rw
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── PostgreSQL Database ───────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-REDACTED}
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_audit}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-healthcare_audit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    expose:
      - "6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── MLflow Tracking Server ────────────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    container_name: mlflow-server
    restart: unless-stopped
    expose:
      - "5000"
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REDACTED}@db:5432/${POSTGRES_DB:-healthcare_audit}
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlruns
    volumes:
      - mlflow_artifacts:/mlruns
    command: >
      bash -c "pip install mlflow psycopg2-binary &&
      mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REDACTED}@db:5432/${POSTGRES_DB:-healthcare_audit} --default-artifact-root /mlruns"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Nginx reverse proxy (public-facing) ──────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
      - ../../frontend/src/assets:/app/static:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Prometheus (profiles: monitoring) ────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../../monitoring/metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal
    profiles:
      - monitoring
    depends_on:
      - web

  # ── Grafana (profiles: monitoring) ───────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-healthpredict_admin_setup_2026}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../monitoring/dashboards/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/dashboards/grafana_dashboard.json:/var/lib/grafana/dashboards/healthpredict.json:ro
    networks:
      - internal
    profiles:
      - monitoring
    depends_on:
      - prometheus

networks:
  internal:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  mlflow_artifacts:
