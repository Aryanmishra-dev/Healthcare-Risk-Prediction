services:
  # ── FastAPI application (internal only — NOT exposed to internet) ─────
  web:
    build:
      context: ../..
      dockerfile: backend/Dockerfile.backend
    image: aryanmdev/healthpredict-ai:latest
    container_name: healthpredict
    # Port is NOT published externally — only accessible via Nginx
    expose:
      - "8000"
    environment:
      - APP_ENV=production
      - RATE_LIMIT_PER_MINUTE=60
      - CORS_ORIGINS=https://yourdomain.com
      - TRUSTED_HOSTS=yourdomain.com,www.yourdomain.com,localhost
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://admin:healthpredict_db_password@db:5432/healthcare_audit
    depends_on:
      - redis
      - db
    volumes:
      - ../../ml/models:/app/ml/models:ro
      - ../../data:/app/data:rw
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── PostgreSQL Database (Audit Logs) ─────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: healthpredict_db_password
      POSTGRES_DB: healthcare_audit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d healthcare_audit"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (caching and rate limiting) ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    expose:
      - "6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Nginx reverse proxy (public-facing) ──────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
      - ../../frontend/src/assets:/app/static:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Nginx (dev mode — HTTP only, no SSL) ─────────────────────────────
  nginx-dev:
    image: nginx:1.27-alpine
    container_name: nginx-dev
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../frontend/src/assets:/app/static:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - internal
    profiles:
      - dev

  # ── Prometheus (profiles: monitoring) ────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../../monitoring/metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal
    profiles:
      - monitoring
    depends_on:
      - web

  # ── Grafana (profiles: monitoring) ───────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-healthpredict_admin_setup_2026}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../monitoring/dashboards/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/dashboards/grafana_dashboard.json:/var/lib/grafana/dashboards/healthpredict.json:ro
    networks:
      - internal
    profiles:
      - monitoring
    depends_on:
      - prometheus

networks:
  internal:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
