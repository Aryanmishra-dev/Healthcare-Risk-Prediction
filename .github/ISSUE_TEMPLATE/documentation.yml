name: Documentation
description: Report a documentation issue or suggest improvements
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: Help us improve the docs.
  - type: input
    id: page
    attributes:
      label: Document Page
      description: Which document or section needs attention?
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
