name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements-dev.txt') }}
      - name: Install dependencies
        run: pip install --quiet -r requirements-dev.txt
      - name: Lint with flake8
        run: flake8 app/ --max-line-length=100 --ignore=E203,W503

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-audit-${{ hashFiles('backend/requirements.txt') }}
      - name: Install dependencies
        run: pip install --quiet -r requirements-dev.txt
      - name: Check dependencies for vulnerabilities
        run: pip-audit --strict -r requirements.txt

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-security-${{ hashFiles('backend/requirements-dev.txt') }}
      - name: Install dependencies
        run: pip install --quiet -r requirements-dev.txt
      - name: Security scan with bandit
        run: bandit --recursive ../backend/app/ ../config/ ../shared/ --quiet --skip=B101

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TESTING: "1"
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///test.db
      SYNC_DATABASE_URL: sqlite:///test.db
      REDIS_URL: ""
      JWT_SECRET_KEY: test-secret-key-for-ci-at-least-32-chars!!
      API_KEY: test-api-key-for-ci-over-32-characters-long
      DEV_API_KEY: test-dev-key-for-ci-over-32-characters-long
      ALLOWED_ORIGINS: http://testserver
      TRUSTED_HOSTS: testserver
      SECRET_KEY: test-secret-key-for-ci-at-least-32-chars!!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('backend/requirements-dev.txt') }}
      - name: Install dependencies
        run: pip install --quiet -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov-fail-under=70
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  build-check:
    runs-on: ubuntu-latest
    needs: [lint, audit, security, test]
    if: success()
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --no-cache --target=runtime -t healthpredict-ci .

  deploy:
    runs-on: ubuntu-latest
    needs: [build-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl --fail --silent --show-error \
            --request POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            --output /dev/null \
            --write-out 'Render deploy triggered: HTTP %{http_code}\n'
