name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run Black
        run: black --check backend/
      - name: Run isort
        run: isort --check-only backend/
      - name: Run Flake8
        run: flake8 backend/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt mypy
      - name: Run mypy
        run: mypy backend/

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bandit & Safety
        run: pip install bandit safety
      - name: Run Bandit
        run: bandit -r backend/ -ll
      - name: Run Safety
        run: safety check -r backend/requirements.txt --full-report || true

  test:
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: REDACTED
          POSTGRES_DB: healthcare_audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest pytest-cov
      - name: Wait for services
        run: sleep 5
      - name: Run Tests
        env:
          DATABASE_URL: postgresql+asyncpg://admin:REDACTED@localhost:5432/healthcare_audit_test
          SYNC_DATABASE_URL: postgresql://admin:REDACTED@localhost:5432/healthcare_audit_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key
        run: pytest tests/ --cov=backend/app --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  migrations-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: REDACTED
          POSTGRES_DB: healthcare_audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt alembic
      - name: Run Alembic Upgrade
        env:
          DATABASE_URL: postgresql+asyncpg://admin:REDACTED@localhost:5432/healthcare_audit_test
          SYNC_DATABASE_URL: postgresql://admin:REDACTED@localhost:5432/healthcare_audit_test
        run: |
          cd backend
          alembic upgrade head
      - name: Run Alembic Downgrade
        env:
          DATABASE_URL: postgresql+asyncpg://admin:REDACTED@localhost:5432/healthcare_audit_test
          SYNC_DATABASE_URL: postgresql://admin:REDACTED@localhost:5432/healthcare_audit_test
        run: |
          cd backend
          alembic downgrade base

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: healthpredict-ai:test
