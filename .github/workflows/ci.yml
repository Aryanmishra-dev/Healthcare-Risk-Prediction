name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  # CI-specific service credentials — set these in GitHub repo secrets
  PG_USER: ${{ secrets.PG_USER || 'admin_test' }}
  PG_PASSWORD: ${{ secrets.PG_PASSWORD || 'test_password' }}
  PG_DB: ${{ secrets.PG_DB || 'healthcare_audit_test' }}
  TEST_SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'test-secret-key-ci' }}

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install black isort flake8
      - name: Run Black
        run: black --check backend/
      - name: Run isort
        run: isort --check-only backend/
      - name: Run Flake8
        run: flake8 backend/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt mypy
      - name: Run mypy
        run: mypy backend/

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Bandit & Safety
        run: pip install bandit safety
      - name: Run Bandit
        run: bandit -r backend/ -ll
      - name: Run Safety
        run: safety check -r backend/requirements.txt --full-report || true

  test:
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ env.PG_USER }}
          POSTGRES_PASSWORD: ${{ env.PG_PASSWORD }}
          POSTGRES_DB: ${{ env.PG_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Wait for services
        run: sleep 5
      - name: Run Tests
        env:
          DATABASE_URL: postgresql+asyncpg://${{ env.PG_USER }}:${{ env.PG_PASSWORD }}@localhost:5432/${{ env.PG_DB }}
          SYNC_DATABASE_URL: postgresql://${{ env.PG_USER }}:${{ env.PG_PASSWORD }}@localhost:5432/${{ env.PG_DB }}
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ${{ env.TEST_SECRET_KEY }}
        run: pytest tests/ --cov=backend/app --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  migrations-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ env.PG_USER }}
          POSTGRES_PASSWORD: ${{ env.PG_PASSWORD }}
          POSTGRES_DB: ${{ env.PG_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt alembic
      - name: Run Alembic Upgrade
        env:
          DATABASE_URL: postgresql+asyncpg://${{ env.PG_USER }}:${{ env.PG_PASSWORD }}@localhost:5432/${{ env.PG_DB }}
          SYNC_DATABASE_URL: postgresql://${{ env.PG_USER }}:${{ env.PG_PASSWORD }}@localhost:5432/${{ env.PG_DB }}
        run: |
          cd backend
          alembic upgrade head
      - name: Run Alembic Downgrade
        env:
          DATABASE_URL: postgresql+asyncpg://${{ env.PG_USER }}:${{ env.PG_PASSWORD }}@localhost:5432/${{ env.PG_DB }}
          SYNC_DATABASE_URL: postgresql://${{ env.PG_USER }}:${{ env.PG_PASSWORD }}@localhost:5432/${{ env.PG_DB }}
        run: |
          cd backend
          alembic downgrade base

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: healthpredict-ai:test
