name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install flake8
      - name: Lint — syntax errors & undefined names
        run: flake8 app/ fastapi_backend/ utils/ feature_store/ scripts/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Lint — style warnings
        run: flake8 app/ fastapi_backend/ utils/ feature_store/ scripts/ tests/ --count --max-line-length=120 --max-complexity=10 --statistics --exit-zero

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml
      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies for vulnerabilities
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: healthpredict-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image runs
        run: |
          docker build -t healthpredict-ai:test .
          docker run --rm -d --name hptest -p 8000:8000 healthpredict-ai:test
          sleep 10
          curl -f http://localhost:8000/api || exit 1
          docker stop hptest
