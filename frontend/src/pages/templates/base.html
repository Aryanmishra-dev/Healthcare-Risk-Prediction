<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{% block title %}Healthcare AI - Risk Prediction{% endblock %}</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                "primary": "#0284c5",
                "background-light": "#f5f7f8",
            },
            fontFamily: { "display": ["Inter", "sans-serif"] },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
    },
}
var HEALTHPREDICT_API_URL = "__HEALTHPREDICT_API_URL__";
var HEALTHPREDICT_API_URL_PLACEHOLDER = "__HEALTHPREDICT" + "_API_URL__";
(function () {
    function normalizeApiUrl(value) {
        value = (value || "").trim();
        if (!value || value === HEALTHPREDICT_API_URL_PLACEHOLDER) return "";
        return value.replace(/\/+$/, "");
    }
    function readCookie(name) {
        var match = document.cookie.match(new RegExp("(^| )" + name + "=([^;]+)"));
        return match ? match[2] : "";
    }
    var config = {
        apiUrl: normalizeApiUrl(HEALTHPREDICT_API_URL),
        csrfToken: "",
        csrfReady: null
    };
    config.apiPath = function(path) {
        if (!path) return config.apiUrl || "";
        if (path.indexOf(HEALTHPREDICT_API_URL_PLACEHOLDER) === 0) {
            path = path.slice(HEALTHPREDICT_API_URL_PLACEHOLDER.length) || "/";
        }
        if (/^https?:\/\//i.test(path)) return path;
        if (!config.apiUrl) return path;
        return config.apiUrl + (path.charAt(0) === "/" ? path : "/" + path);
    };
    config.getCsrfToken = function() {
        return config.csrfToken || readCookie("csrf_token");
    };
    config.ensureCsrfToken = function() {
        if (!config.apiUrl) {
            config.csrfToken = config.getCsrfToken();
            return Promise.resolve(config.csrfToken);
        }
        if (config.csrfReady) return config.csrfReady;
        config.csrfReady = fetch(config.apiPath("/"), {
            method: "GET",
            credentials: "include",
            mode: "cors"
        }).then(function(response) {
            config.csrfToken = response.headers.get("X-CSRFToken") || config.csrfToken;
            return config.csrfToken;
        }).catch(function() {
            return config.csrfToken;
        });
        return config.csrfReady;
    };
    config.fetch = function(path, options) {
        return fetch(config.apiPath(path), Object.assign({ credentials: "include" }, options || {}));
    };
    window.HealthPredictConfig = config;
})();
if (window.htmx) {
    window.htmx.config.withCredentials = true;
}
document.addEventListener("DOMContentLoaded", function() {
    window.HealthPredictConfig.ensureCsrfToken();
});
document.addEventListener("htmx:configRequest", function(evt) {
    var config = window.HealthPredictConfig;
    if (config) {
        evt.detail.path = config.apiPath(evt.detail.path);
        var token = config.getCsrfToken();
        if (token) {
            evt.detail.headers["X-CSRFToken"] = token;
        }
    }
});
</script>
<style>
body { font-family: 'Inter', sans-serif; }
.hide-scrollbar::-webkit-scrollbar { display: none; }
.hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.section-panel { display: none; }
.section-panel.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.animate-fade-up { animation: fadeUp 0.35s ease; }
.htmx-indicator { display: none; }
.htmx-request .htmx-indicator { display: inline-flex; }
.htmx-request .htmx-hide-on-request { display: none; }
[x-cloak] { display: none !important; }

/* ── Scroll mask for horizontal nav ──────────────────────── */
.mask-edges {
    -webkit-mask-image: linear-gradient(to right, transparent, black 12px, black calc(100% - 12px), transparent);
    mask-image: linear-gradient(to right, transparent, black 12px, black calc(100% - 12px), transparent);
}

/* ── Typography & Readability ─────────────────────────── */
.text-heavy-page {
    max-width: 780px;
    margin: 0 auto;
}
.text-heavy-page p, .text-heavy-page li {
    line-height: 1.7;
}
.text-heavy-page h2, .text-heavy-page h3, .text-heavy-page h4 {
    margin-top: 2.5rem;
}

/* ── Virtual Doctor Animation ─────────────────────────── */
.doctor-widget {
    background: linear-gradient(135deg, #0369a1 0%, #0284c7 100%);
    border-radius: 0.75rem;
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: white;
    text-align: center;
    overflow: hidden;
}
.doctor-widget[data-dr-disease="Heart Disease"] {
    background: linear-gradient(135deg, #b91c1c 0%, #ef4444 100%);
}
.doctor-widget[data-dr-disease="Lung Cancer"] {
    background: linear-gradient(135deg, #5b21b6 0%, #7c3aed 100%);
}
.doctor-avatar-box {
    position: relative;
    border-radius: 50%;
}
.doctor-avatar-box.speaking {
    animation: dr-pulse-ring 2s infinite cubic-bezier(0.25, 1, 0.5, 1);
}
.doctor-avatar-box img {
    width: 120px; height: 120px;
    object-fit: cover;
    object-position: top;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.2);
    box-shadow: 0 12px 20px -4px rgba(0,0,0,0.3);
    transition: transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275), border-color 0.4s;
    position: relative; z-index: 2;
}
.doctor-avatar-box.speaking img {
    transform: scale(1.05);
    border-color: rgba(56,189,248,1);
    box-shadow: 0 0 30px rgba(56,189,248,0.5);
}
@keyframes dr-pulse-ring {
    0%  { box-shadow: 0 0 0 0 rgba(56,189,248,0.5); }
    70% { box-shadow: 0 0 0 25px rgba(56,189,248,0); }
    100%{ box-shadow: 0 0 0 0 rgba(56,189,248,0); }
}
.dr-audio-waves {
    display: flex; gap: 5px; height: 30px;
    align-items: center; margin-top: 1.25rem;
    opacity: 0; transition: opacity 0.3s;
}
.dr-audio-waves.active { opacity: 1; }
.dr-wave {
    width: 4px; height: 28px;
    background: #38bdf8; border-radius: 4px;
    box-shadow: 0 0 8px rgba(56,189,248,0.6);
    transform: scaleY(0.28);
    transform-origin: bottom;
}
.dr-audio-waves.active .dr-wave { animation: dr-wave 1s ease-in-out infinite; }
.dr-audio-waves .dr-wave:nth-child(2) { animation-delay: 0.1s; }
.dr-audio-waves .dr-wave:nth-child(3) { animation-delay: 0.2s; }
.dr-audio-waves .dr-wave:nth-child(4) { animation-delay: 0.3s; }
.dr-audio-waves .dr-wave:nth-child(5) { animation-delay: 0.4s; }
@keyframes dr-wave {
    0%, 100% { transform: scaleY(0.28); }
    50%      { transform: scaleY(1); }
}
.dr-status {
    margin-top: 1rem; font-weight: 600;
    font-size: 0.85rem; color: #f8fafc;
    letter-spacing: 0.3px;
}
.dr-captions {
    margin-top: 0.75rem; font-size: 0.8rem;
    color: #cbd5e1; line-height: 1.6;
    font-style: italic; width: 100%;
    background: rgba(255,255,255,0.05);
    padding: 1rem; border-radius: 0.75rem;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    min-height: 3.5em;
}
.dr-typing { display: inline-flex; gap: 3px; align-items: center; }
.dr-typing span { width: 4px; height: 4px; background: #64748b; border-radius: 50%; animation: dr-typing 1.4s infinite; }
.dr-typing span:nth-child(2) { animation-delay: 0.2s; }
.dr-typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dr-typing { 0%,100% { opacity: 0.2; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }
.dr-play-btn {
    margin-top: 1rem; background: #0284c7; color: white;
    border: none; padding: 0.6rem 1.2rem; border-radius: 0.5rem;
    font-size: 0.8rem; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 0.5rem;
    transition: all 0.2s;
}
.dr-play-btn:hover { background: #0369a1; }

/* ── Upload Drop Zone ──────────────────────────────────── */
.upload-drop-zone {
    border: 2px dashed #cbd5e1;
    border-radius: 0.75rem;
    padding: 2rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    background: #f8fafc;
}
.upload-drop-zone:hover {
    border-color: #0284c5;
    background: rgba(2,132,197,0.04);
}
.upload-drop-zone.drag-over {
    border-color: #0284c5;
    background: rgba(2,132,197,0.08);
    box-shadow: 0 0 0 4px rgba(2,132,197,0.1);
    transform: scale(1.01);
}
</style>
{% block extra_head %}{% endblock %}
</head>
<body class="bg-background-light text-slate-900 antialiased">
<div id="startup-banner" style="display: none;" class="fixed top-0 left-0 w-full bg-blue-600 text-white text-center py-3 z-[9999] shadow-md transition-opacity duration-300">
    <div class="flex items-center justify-center gap-3">
        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="font-medium text-sm sm:text-base">Service is starting up... (This may take ~50 seconds)</span>
    </div>
</div>
{% block body %}{% endblock %}

{% block scripts %}{% endblock %}

<script>
document.addEventListener("DOMContentLoaded", function() {
    var backendUrl = "{{ BACKEND_URL }}";
    var placeholder = String.fromCharCode(123, 123) + " BACKEND_URL " + String.fromCharCode(125, 125);
    var noSpace = String.fromCharCode(123, 123) + "BACKEND_URL" + String.fromCharCode(125, 125);
    if (backendUrl && backendUrl !== placeholder && backendUrl !== noSpace) {
        var banner = document.getElementById("startup-banner");
        var healthUrl = backendUrl.replace(/\/+$/, '') + "/healthz";
        var maxRetries = 18; // 90 seconds (5s intervals)
        var retries = 0;
        
        function checkHealth() {
            fetch(healthUrl, { method: "GET", mode: "cors" })
                .then(function(response) {
                    if (response.ok) {
                        if (banner) {
                            banner.style.opacity = "0";
                            setTimeout(function() { banner.style.display = "none"; }, 300);
                        }
                    } else {
                        throw new Error("Not OK");
                    }
                })
                .catch(function(error) {
                    if (retries === 0 && banner) {
                        banner.style.display = "block";
                    }
                    if (retries < maxRetries) {
                        retries++;
                        setTimeout(checkHealth, 5000);
                    } else {
                        if (banner) {
                            var span = banner.querySelector('span');
                            if(span) span.innerHTML = "Service failed to start. Please refresh the page.";
                            banner.classList.replace("bg-blue-600", "bg-red-600");
                            var svg = banner.querySelector('svg');
                            if(svg) svg.style.display = "none";
                        }
                    }
                });
        }
        checkHealth();
    }
});
</script>
</body>
</html>
