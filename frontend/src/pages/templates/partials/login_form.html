<div class="max-w-md mx-auto mt-8">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-6 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center">
                    <span class="material-symbols-outlined text-primary">login</span>
                </div>
                <div>
                    <h3 class="text-base font-bold text-slate-900">Sign In</h3>
                    <p class="text-xs text-slate-500 mt-0.5">Access your dashboard and prediction history</p>
                </div>
            </div>
        </div>

        <form id="login-form" class="p-6 space-y-4" onsubmit="return false;">
            <div id="login-error" class="hidden p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700"></div>

            <div>
                <label for="login-email" class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
                <input type="email" id="login-email" required
                    class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition-all"
                    placeholder="you@example.com">
            </div>

            <div>
                <label for="login-password" class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" id="login-password" required
                    class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition-all"
                    placeholder="Enter your password">
            </div>

            <button type="submit" id="login-submit"
                class="w-full bg-primary hover:bg-primary/90 text-white py-2.5 rounded-lg font-bold text-sm shadow-sm transition-all flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-base">arrow_forward</span>
                Sign In
            </button>

            <p class="text-center text-xs text-slate-500">
                Don't have an account?
                <a href="/register" onclick="switchTab('register');return false" class="text-primary font-semibold hover:underline">Create one</a>
            </p>
        </form>
    </div>
</div>
