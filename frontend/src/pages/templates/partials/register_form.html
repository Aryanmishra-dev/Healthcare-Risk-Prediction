<div class="max-w-md mx-auto mt-8">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-6 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center">
                    <span class="material-symbols-outlined text-primary">person_add</span>
                </div>
                <div>
                    <h3 class="text-base font-bold text-slate-900">Create Account</h3>
                    <p class="text-xs text-slate-500 mt-0.5">Save your predictions and track your health history</p>
                </div>
            </div>
        </div>

        <form id="register-form" class="p-6 space-y-4" onsubmit="return false;">
            <div id="register-error" class="hidden p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700"></div>

            <div>
                <label for="reg-name" class="block text-sm font-semibold text-slate-700 mb-1">Full Name</label>
                <input type="text" id="reg-name"
                    class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition-all"
                    placeholder="Dr. John Doe">
            </div>

            <div>
                <label for="reg-email" class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
                <input type="email" id="reg-email" required
                    class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition-all"
                    placeholder="you@example.com">
            </div>

            <div>
                <label for="reg-password" class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" id="reg-password" required minlength="8"
                    class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition-all"
                    placeholder="At least 8 characters, 1 uppercase, 1 number">
                <p class="text-[11px] text-slate-400 mt-1">Must include 1 uppercase letter and 1 number</p>
            </div>

            <button type="submit" id="register-submit"
                class="w-full bg-primary hover:bg-primary/90 text-white py-2.5 rounded-lg font-bold text-sm shadow-sm transition-all flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-base">person_add</span>
                Create Account
            </button>

            <p class="text-center text-xs text-slate-500">
                Already have an account?
                <a href="/login" onclick="switchTab('login');return false" class="text-primary font-semibold hover:underline">Sign in</a>
            </p>
        </form>
    </div>
</div>
