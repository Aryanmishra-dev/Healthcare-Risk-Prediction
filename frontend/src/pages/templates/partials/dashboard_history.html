<div class="animate-fade-up space-y-6" x-data="historyPage()" x-init="init()">

  <div class="flex items-center justify-between flex-wrap gap-4">
    <div>
      <h2 class="text-xl font-black text-slate-900">Prediction History</h2>
      <p class="text-sm text-slate-500 mt-1">Full log of every AI risk assessment you've run.</p>
    </div>
    <button onclick="historyPage_exportCsv()"
      class="flex items-center gap-2 bg-primary text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-sky-700 transition-colors shadow-sm">
      <span class="material-symbols-outlined text-[18px]">download</span>
      Download CSV
    </button>
  </div>

  <!-- Filters -->
  <div class="bg-white rounded-xl border border-slate-100 shadow-sm p-4 flex flex-wrap gap-4 items-end">
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1 uppercase tracking-wide">Disease Type</label>
      <select id="hist-filter-type" class="border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none">
        <option value="">All</option>
        <option value="diabetes">Diabetes</option>
        <option value="heart_disease">Heart Disease</option>
        <option value="lung_cancer">Lung Cancer</option>
      </select>
    </div>
    <button onclick="document.querySelector('[x-data]').__x.$data.load()"
      class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-sky-700 transition-colors">
      Apply Filter
    </button>
  </div>

  <!-- Table -->
  <div class="bg-white rounded-xl border border-slate-100 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="bg-slate-50 border-b border-slate-100">
            <th class="px-6 py-3 text-left font-semibold text-slate-600 uppercase text-xs tracking-wider">Date</th>
            <th class="px-6 py-3 text-left font-semibold text-slate-600 uppercase text-xs tracking-wider">Disease</th>
            <th class="px-6 py-3 text-left font-semibold text-slate-600 uppercase text-xs tracking-wider">Risk Score</th>
            <th class="px-6 py-3 text-left font-semibold text-slate-600 uppercase text-xs tracking-wider">Level</th>
            <th class="px-6 py-3 text-left font-semibold text-slate-600 uppercase text-xs tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody id="history-tbody">
          <tr><td colspan="5" class="px-6 py-12 text-center text-slate-400">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
var _histData = [];
function historyPage() {
  return {
    token: null,
    async init() {
      this.token = localStorage.getItem('access_token');
      if (!this.token) { window.location.href = '/'; return; }
      await this.load();
    },
    async load() {
      const type = document.getElementById('hist-filter-type')?.value || '';
      const url = '/auth/history' + (type ? '?disease_type=' + type : '');
      const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + this.token } });
      if (res.status === 401) { localStorage.removeItem('access_token'); window.location.href = '/'; return; }
      _histData = await res.json();
      const tbody = document.getElementById('history-tbody');
      if (!_histData.length) {
        tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-slate-400">
          <span class="material-symbols-outlined text-[40px] block mb-2">history</span>
          No predictions found.</td></tr>`;
        return;
      }
      tbody.innerHTML = _histData.map(p => `
        <tr class="border-b border-slate-50 hover:bg-slate-50/60 transition-colors">
          <td class="px-6 py-4 text-slate-500 text-xs">${new Date(p.created_at).toLocaleString()}</td>
          <td class="px-6 py-4 font-medium text-slate-900 capitalize">${p.disease_type?.replace('_',' ')}</td>
          <td class="px-6 py-4">
            <div class="flex items-center gap-2">
              <div class="h-1.5 w-24 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full rounded-full ${p.risk_score > 66 ? 'bg-rose-500' : p.risk_score > 33 ? 'bg-amber-500' : 'bg-emerald-500'}"
                     style="width:${p.risk_score}%"></div>
              </div>
              <span class="font-bold text-slate-900">${p.risk_score}%</span>
            </div>
          </td>
          <td class="px-6 py-4">
            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${
              p.risk_level === 'high' ? 'bg-rose-100 text-rose-700' :
              p.risk_level === 'medium' ? 'bg-amber-100 text-amber-700' :
              'bg-emerald-100 text-emerald-700'
            }">${p.risk_level?.toUpperCase()}</span>
          </td>
          <td class="px-6 py-4">
            <button onclick="historyPage_delete('${p.id}')"
              class="text-rose-500 text-sm font-semibold hover:underline flex items-center gap-1">
              <span class="material-symbols-outlined text-[16px]">delete</span> Delete
            </button>
          </td>
        </tr>`).join('');
    },
    async deleteRecord(id) {
      if (!confirm('Delete this prediction record?')) return;
      await fetch('/auth/history/' + id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + this.token } });
      await this.load();
    }
  }
}
window.historyPage_delete = (id) => {
  document.querySelector('[x-data]').__x.$data.deleteRecord(id);
};
window.historyPage_exportCsv = () => {
  if (!_histData.length) return alert('No data to export.');
  const rows = [['Date','Disease','Risk Score','Risk Level']];
  _histData.forEach(p => rows.push([
    new Date(p.created_at).toLocaleString(),
    p.disease_type, p.risk_score, p.risk_level
  ]));
  const csv = rows.map(r => r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'prediction_history.csv';
  a.click();
};
</script>
